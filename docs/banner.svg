<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AssetMind — Smart Office Asset Memory and Maintenance System" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="tile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>
  <circle cx="1060" cy="40" r="260" fill="url(#glowA)"/>
  <circle cx="260" cy="340" r="240" fill="url(#glowB)"/>
  <rect y="316" width="1200" height="4" fill="url(#accent)"/>

  <!-- logo tile with package icon -->
  <rect x="70" y="66" width="92" height="92" rx="24" fill="url(#tile)"/>
  <rect x="70" y="66" width="92" height="92" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>
  <g transform="translate(86,82) scale(2.5)" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="m7.5 4.27 9 5.15"/>
    <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
    <path d="m3.3 7 8.7 5 8.7-5"/>
    <path d="M12 22V12"/>
  </g>

  <!-- title -->
  <text x="188" y="122" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF">AssetMind</text>
  <text x="190" y="156" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#CBD5E1">Smart Office Asset Memory &amp; Maintenance System</text>

  <!-- pills: company + hackathon -->
  <g font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">
    <rect x="190" y="180" width="214" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.28"/>
    <circle cx="210" cy="196" r="4.5" fill="#34D399"/>
    <circle cx="210" cy="196" r="8" fill="#34D399" fill-opacity="0.25"/>
    <text x="224" y="200" fill="#FFFFFF">NEXORA TECHNOLOGIES</text>

    <rect x="416" y="180" width="352" height="32" rx="16" fill="#F59E0B" fill-opacity="0.16" stroke="#FBBF24" stroke-opacity="0.7"/>
    <text x="592" y="200" fill="#FDE68A" text-anchor="middle">GLOBAL INNOVATION BUILD CHALLENGE V2</text>
  </g>

  <!-- team + stack -->
  <g font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
